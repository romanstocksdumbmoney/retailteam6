<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DumbDollars — Reset Password</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="payment-page-body">
    <main class="ai-trade-page-shell">
      <article class="ai-trade-page-card card" role="main" aria-labelledby="reset-password-title">
        <a class="open-link" href="/ai-trade-access.html?mode=login&next=%2F">Back to sign in</a>
        <h1 id="reset-password-title">Set your new password</h1>
        <p class="small-note">Use at least 8 characters with 1 uppercase, 1 number, and 1 special character.</p>
        <form id="reset-password-form" class="auth-form">
          <label>
            New password
            <input id="reset-password-new" type="password" autocomplete="new-password" required />
          </label>
          <label>
            Confirm new password
            <input id="reset-password-confirm" type="password" autocomplete="new-password" required />
          </label>
          <p id="reset-password-strength" class="password-strength password-strength--weak">Strength: Weak</p>
          <button id="reset-password-submit" type="submit">Reset Password</button>
        </form>
        <p id="reset-password-status" class="small-note" aria-live="polite"></p>
      </article>
    </main>
    <script src="./reset-password.js"></script>
  </body>
</html>
