<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | DumbDollars</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="payment-page-body">
    <main class="ai-trade-page-shell">
      <article class="ai-trade-page-card card" role="main" aria-labelledby="forgot-password-title">
        <a class="open-link" href="/ai-trade-access.html?mode=login&next=%2F">Back to login</a>
        <h1 id="forgot-password-title">Reset your password</h1>
        <p class="small-note">Enter your account email and we will send a secure reset link.</p>
        <form id="forgot-password-form" class="auth-form">
          <label for="forgot-password-email">
            Email
            <input id="forgot-password-email" type="email" placeholder="email@domain.com" required />
          </label>
          <button id="forgot-password-submit" type="submit">Send reset link</button>
        </form>
        <p id="forgot-password-status" class="small-note" aria-live="polite"></p>
      </article>
    </main>
    <script src="./forgot-password.js"></script>
  </body>
</html>
