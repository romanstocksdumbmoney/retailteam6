<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Diamond Hands Wall Street background</title>
  <desc id="desc">Stylized trader silhouette with glowing diamonds, arrows, and market chart lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#02040a" />
      <stop offset="100%" stop-color="#050a14" />
    </linearGradient>
    <radialGradient id="tealGlow" cx="78%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="greenGlow" cx="20%" cy="70%" r="48%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ac7e9" />
      <stop offset="100%" stop-color="#5b7a9a" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)" />
  <rect width="1920" height="1080" fill="url(#tealGlow)" />
  <rect width="1920" height="1080" fill="url(#greenGlow)" />

  <g opacity="0.25" stroke-linecap="round">
    <path d="M80 760 L260 700 L430 735 L600 620 L790 655 L960 560 L1160 595 L1380 480 L1610 510 L1840 430" stroke="#22c55e" stroke-width="6" fill="none" filter="url(#softGlow)" />
    <path d="M130 830 L330 770 L520 805 L690 740 L860 760 L1060 690 L1260 710 L1480 640 L1710 660" stroke="#06b6d4" stroke-width="5" fill="none" filter="url(#softGlow)" />
  </g>

  <g opacity="0.27">
    <rect x="130" y="600" width="10" height="72" fill="#22c55e" />
    <rect x="210" y="640" width="10" height="54" fill="#ef4444" />
    <rect x="300" y="560" width="10" height="90" fill="#22c55e" />
    <rect x="380" y="610" width="10" height="68" fill="#ef4444" />
    <rect x="470" y="530" width="10" height="110" fill="#22c55e" />
    <rect x="560" y="570" width="10" height="82" fill="#22c55e" />
    <rect x="650" y="620" width="10" height="58" fill="#ef4444" />
    <rect x="740" y="540" width="10" height="96" fill="#22c55e" />
    <rect x="830" y="595" width="10" height="66" fill="#22c55e" />
  </g>

  <g transform="translate(1320 360)" opacity="0.58">
    <circle cx="150" cy="80" r="56" fill="url(#skin)" />
    <rect x="72" y="128" width="156" height="230" rx="18" fill="url(#suit)" />
    <rect x="35" y="165" width="54" height="148" rx="16" transform="rotate(18 62 239)" fill="url(#suit)" />
    <rect x="211" y="165" width="54" height="148" rx="16" transform="rotate(-18 238 239)" fill="url(#suit)" />
    <polygon points="150,132 168,210 132,210" fill="#38bdf8" opacity="0.82" />
    <rect x="102" y="355" width="40" height="150" rx="12" fill="#111827" />
    <rect x="158" y="355" width="40" height="150" rx="12" fill="#111827" />
  </g>

  <g fill="#67e8f9" opacity="0.58" filter="url(#softGlow)">
    <polygon points="240,290 274,332 240,376 206,332" />
    <polygon points="580,220 610,256 580,292 550,256" />
    <polygon points="960,300 1000,350 960,400 920,350" />
    <polygon points="1240,250 1278,298 1240,346 1202,298" />
    <polygon points="1660,220 1706,278 1660,336 1614,278" />
  </g>

  <g fill="#4ade80" opacity="0.62" font-family="Inter, Arial, sans-serif" font-size="70" font-weight="700" filter="url(#softGlow)">
    <text x="320" y="470">—</text>
    <text x="760" y="470">—</text>
    <text x="1120" y="430">—</text>
    <text x="1510" y="430">—</text>
  </g>

  <text x="120" y="980" fill="#7dd3fc" opacity="0.3" font-family="Inter, Arial, sans-serif" font-size="58" letter-spacing="5">DIAMOND HANDS MARKET ENERGY</text>
</svg>
